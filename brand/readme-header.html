<!doctype html><html><head>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Sofia+Sans+Extra+Condensed:wght@900&family=Sofia+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  /* Cabecera del README y vista previa social de GitHub (1280×640). Mismo sistema que banner.html. */
  :root{--paper:#F3EBDD;--blue:#2B59C3;--orange:#FF6B1A}
  body{margin:0}
  .h{position:relative;width:1280px;height:640px;background:var(--paper) url(_banner-base@2x.png) right bottom/auto 100% no-repeat;overflow:hidden}
  .h::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--paper) 34%,rgba(243,235,221,0) 64%)}
  .t{position:absolute;left:72px;top:84px}
  .k{font:700 22px/1 'Sofia Sans Condensed';letter-spacing:.24em;color:var(--blue);opacity:.85}
  .ink{position:relative;margin-top:20px;font:900 164px/.84 'Sofia Sans Extra Condensed';text-transform:uppercase;white-space:nowrap}
  .ink span{display:block}
  .ink .o{position:absolute;left:7px;top:6px;color:var(--orange)}
  .ink .u{position:relative;color:var(--blue)}
  .s{margin-top:34px;font:700 34px/1.12 'Sofia Sans Condensed';color:var(--blue);width:520px}
  .f{position:absolute;left:72px;bottom:56px;display:flex;gap:14px;font:14px/1 'Fragment Mono';letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
  .f span{border:2px solid var(--blue);padding:9px 12px 8px;background:var(--paper)}
  .f span.hot{border-color:var(--orange);color:var(--orange)}
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.35;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .95 0 0 0 0 .92 0 0 0 0 .87 0 0 0 1.7 -.6'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
</style></head><body>
<div class="h">
  <div class="t">
    <div class="k">SNOWMOON · CHAPTER 17 · ON ETHEREUM</div>
    <div class="ink"><span class="o">Graph<br>Funding</span><span class="u">Graph<br>Funding</span></div>
    <div class="s">Nobody votes on the whole budget.</div>
  </div>
  <div class="f"><span>Public goods tree</span><span>Committees drawn at random</span><span class="hot">Every 6 hours</span></div>
  <div class="grain"></div>
</div></body></html>
