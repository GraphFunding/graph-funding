<!doctype html><html><head>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@900&family=Sofia+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2B59C3;--orange:#FF6B1A}
  body{margin:0}
  .p{position:relative;width:1080px;height:1350px;background:url(_post-base.png) 0 0/1080px 1350px;overflow:hidden}
  .kick{position:absolute;left:72px;top:70px;font:700 22px/1 'Sofia Sans Condensed';letter-spacing:.24em;color:var(--blue);opacity:.85}
  .ink{position:absolute;left:66px;top:104px;font:900 128px/.84 'Sofia Sans Extra Condensed';text-transform:uppercase}
  .ink span{display:block;white-space:nowrap}
  .ink .o{position:absolute;left:6px;top:5px;color:var(--orange);opacity:.95}
  .ink .u{position:relative;color:var(--blue)}
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.4;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .95 0 0 0 0 .92 0 0 0 0 .87 0 0 0 1.7 -.6'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
</style></head><body>
<div class="p">
  <div class="kick">SNOWMOON · CHAPTER 17</div>
  <div class="ink"><span class="o">Nobody votes on<br>the whole budget.</span><span class="u">Nobody votes on<br>the whole budget.</span></div>
  <div class="grain"></div>
</div></body></html>
