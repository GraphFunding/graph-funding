<!doctype html><html><head>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@900&family=Sofia+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2B59C3;--orange:#FF6B1A}
  body{margin:0}
  .b{position:relative;width:1500px;height:500px;background:url(_banner-base@2x.png) 0 0/1500px 500px;overflow:hidden}
  .kick{position:absolute;left:66px;top:46px;font:700 20px/1 'Sofia Sans Condensed';letter-spacing:.24em;color:var(--blue);opacity:.85}
  .ink{position:absolute;left:62px;top:62px;font:900 116px/.84 'Sofia Sans Extra Condensed';text-transform:uppercase;letter-spacing:.005em}
  .ink span{display:block;white-space:nowrap}
  .ink .o{position:absolute;left:6px;top:5px;color:var(--orange);opacity:.95}
  .ink .u{position:relative;color:var(--blue)}
  /* la frase va a la derecha del avatar de X (círculo r≈137 en 152,396) */
  .sub{position:absolute;left:330px;top:300px;font:700 24px/1.15 'Sofia Sans Condensed';color:var(--blue);width:380px}
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.4;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .95 0 0 0 0 .92 0 0 0 0 .87 0 0 0 1.7 -.6'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
</style></head><body>
<div class="b">
  <div class="kick">SNOWMOON · CHAPTER 17</div>
  <div class="ink"><span class="o">Graph<br>Funding</span><span class="u">Graph<br>Funding</span></div>
  <div class="sub">The funding system that survived an empire.</div>
  <div class="grain"></div>
</div></body></html>
