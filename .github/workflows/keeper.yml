name: keeper
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  tick:
    if: ${{ vars.GRAPHFUND_ADDRESS != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node keeper.mjs
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          GRAPHFUND_ADDRESS: ${{ vars.GRAPHFUND_ADDRESS }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
