name: keeper
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
# One run at a time: a late cron tick or a manual dispatch waits for the running one instead of racing it on the same
# draw/advance (or nonce).
concurrency:
  group: keeper
  cancel-in-progress: false
jobs:
  tick:
    if: ${{ vars.GRAPHFUND_ADDRESS != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops/keeper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node keeper.mjs
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          GRAPHFUND_ADDRESS: ${{ vars.GRAPHFUND_ADDRESS }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          MIN_BALANCE_ETH: ${{ vars.MIN_BALANCE_ETH }}
