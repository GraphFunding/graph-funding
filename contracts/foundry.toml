[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

# Isolated-EVM-call gas measurement: each top-level call runs in its own EVM context (no warm-storage
# discount from earlier calls in the same test transaction), matching mainnet single-tx gas costs.
# Unset keys fall back to [profile.default].
[profile.gas]
isolate = true
